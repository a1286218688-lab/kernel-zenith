name: Build Zenith Kernel for Surface

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 安装内核编译工具
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev

      - name: 克隆 Zenith 内核源码
        run: |
          # 仅克隆内核仓库，体积非常小
          git clone github.com -b zenith-14 --depth=1
          
      - name: 配置并编译 Surface 内核驱动
        run: |
          cd kernel-zenith
          # 使用默认配置
          make x86_64_defconfig
          
          # 强制开启 Surface 核心驱动
          scripts/config --enable CONFIG_SURFACE_AGGREGATOR
          scripts/config --enable CONFIG_SURFACE_AGGREGATOR_BUS
          scripts/config --enable CONFIG_SURFACE_HOTPLUG
          scripts/config --enable CONFIG_HID_SURFACE_HID
          
          # 开始编译 (只要 10-15 分钟)
          make bzImage -j$(nproc)
          make modules -j$(nproc)

      - name: 打包产物
        run: |
          mkdir output
          cp kernel-zenith/arch/x86/boot/bzImage output/kernel
          # 压缩模块
          cd kernel-zenith
          make INSTALL_MOD_PATH=../output/modules_install modules_install
          cd ../output
          tar -czvf surface_modules.tar.gz modules_install

      - name: 上传内核产物
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Zenith-Kernel-Files
          path: output/*
