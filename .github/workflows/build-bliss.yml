name: Build Zenith Kernel for Surface

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 获取内核源码
        uses: actions/checkout@v4
        with:
          path: kernel-source  # 将内核源码放在子目录，防止路径混淆

      - name: 2. 获取 KernelSU 源码
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          path: kernel-source/drivers/kernelsu # 直接检出到目标位置

      - name: 3. 安装内核编译工具
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev libncurses-dev rsync

      - name: 4. 自动关联 KernelSU
        working-directory: kernel-source
        run: |
          # 确保驱动层级引用了 KernelSU
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu/" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: 5. 配置并开启驱动
        working-directory: kernel-source
        run: |
          make x86_64_defconfig
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_SURFACE_AGGREGATOR_BUS \
                           --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY \
                           --enable CONFIG_SURFACE_HOTPLUG \
                           --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_SURFACE_GPE \
                           --enable CONFIG_SURFACE_SAM \
                           --enable CONFIG_KSU
          make olddefconfig

      - name: 6. 编译内核
        working-directory: kernel-source
        run: |
          make bzImage -j$(nproc)
          make modules -j$(nproc)

      - name: 7. 整理并打包产物
        working-directory: kernel-source
        run: |
          mkdir -p ../output/modules_install
          cp arch/x86/boot/bzImage ../output/kernel
          make INSTALL_MOD_PATH=../output/modules_install modules_install
          cd ../output && tar -czvf surface_modules.tar.gz modules_install

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Zenith-Kernel-Package
          path: output/
