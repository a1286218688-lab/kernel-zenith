
name: Build Stable Slim Surface Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: 2. 检出 KernelSU
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          path: ksu-src
          fetch-depth: 1

      - name: 3. 安装必备环境
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev \
          libncurses-dev rsync pahole llvm lld clang libzstd-dev lz4 wget tar

      - name: 4. 物理集成 KernelSU
        run: |
          cd kernel-source
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          cp -r ../ksu-src/kernel/* drivers/kernelsu/
          sed -i '/kernelsu/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: 5. 核心驱动补全与体积瘦身 (修正版)
        working-directory: kernel-source
        run: |
          make mrproper
          make x86_64_defconfig
          
          # --- 1. 体积瘦身 (仅针对调试信息，不剔除任何硬件驱动) ---
          ./scripts/config --disable CONFIG_DEBUG_INFO \
                           --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
                           --disable CONFIG_DEBUG_INFO_DWARF4 \
                           --disable CONFIG_DEBUG_INFO_DWARF5 \
                           --disable CONFIG_DEBUG_FS \
                           --disable CONFIG_WERROR
          
          # --- 2. 补全 Surface 核心驱动 (确保一个不缺) ---
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_SURFACE_AGGREGATOR_BUS \
                           --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY \
                           --enable CONFIG_SURFACE_AGGREGATOR_HUB \
                           --enable CONFIG_SURFACE_HOTPLUG \
                           --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_SURFACE_GPE \
                           --enable CONFIG_SURFACE_SAM
          
          # --- 3. 补全触摸驱动链 (IPTS + ISH + 基础总线) ---
          ./scripts/config --enable CONFIG_VIDEO_IPTS \
                           --enable CONFIG_INTEL_IPTS \
                           --enable CONFIG_HID_IPTS \
                           --enable CONFIG_INTEL_ISH_HID \
                           --enable CONFIG_INTEL_ISH_FIRMWARE_DOWNLOADER \
                           --enable CONFIG_HID_SENSOR_HUB \
                           --enable CONFIG_INTEL_VSEC \
                           --enable CONFIG_I2C_HID_ACPI \
                           --enable CONFIG_I2C_DESIGNWARE_PLATFORM
          
          # --- 4. 基础 HID 与 KernelSU ---
          ./scripts/config --enable CONFIG_HID_MULTITOUCH \
                           --enable CONFIG_USB_HID \
                           --enable CONFIG_KSU
          
          # 确保驱动全部作为内核内置或必需模块加载
          make olddefconfig

      - name: 6. 编译并强制剥离符号 (Strip)
        working-directory: kernel-source
        run: |
          make bzImage -j$(nproc) KCFLAGS="-w"
          # 剥离模块符号是减小体积最安全的方法，不会影响功能
          make modules -j$(nproc) KCFLAGS="-w" INSTALL_MOD_STRIP=1

      - name: 7. 获取最新 iptsd 并打包
        run: |
          mkdir -p output/bin
          wget github.com -O output/bin/iptsd
          chmod +x output/bin/iptsd

          if [ -f "kernel-source/arch/x86/boot/bzImage" ]; then
            cp kernel-source/arch/x86/boot/bzImage output/kernel
            cd kernel-source
            # 关键：INSTALL_MOD_STRIP=1 仅删除调试文本，不删除驱动代码
            make INSTALL_MOD_PATH=../output/modules_install INSTALL_MOD_STRIP=1 modules_install
            cd ../output
            tar -czvf surface_stable_slim.tar.gz modules_install bin/iptsd
          else
            echo "Build Failed"
            exit 1
          fi

      - name: 8. 上传
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Stable-Slim-Kernel-2026
          path: |
            output/kernel
            output/surface_stable_slim.tar.gz
