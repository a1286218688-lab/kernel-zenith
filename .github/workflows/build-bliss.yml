
name: Build Stable Slim Universal Surface Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: 2. 检出 KernelSU
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          path: ksu-src
          fetch-depth: 1

      - name: 3. 安装必备环境
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev \
          libncurses-dev rsync pahole llvm lld clang libzstd-dev lz4 wget tar

      - name: 4. 物理集成 KernelSU
        run: |
          cd kernel-source
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          cp -r ../ksu-src/kernel/* drivers/kernelsu/
          sed -i '/kernelsu/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: 5. 配置兼容驱动并关闭 BZIMAGE 压缩
        working-directory: kernel-source
        run: |
          make mrproper
          make x86_64_defconfig
          
          # --- A. 体积瘦身 (仅针对调试信息，不剔除任何硬件驱动) ---
          ./scripts/config --disable CONFIG_DEBUG_INFO \
                           --disable CONFIG_DEBUG_FS \
                           --disable CONFIG_WERROR \
                           --disable CONFIG_GCC_PLUGINS
          
          # --- B. 核心修复：强制关闭内核 (BZIMAGE) 压缩 ---
          # 这会使生成的 kernel 文件变大 (约 50-70MB)，但兼容性最好
          ./scripts/config --disable CONFIG_KERNEL_GZIP \
                           --disable CONFIG_KERNEL_BZIP2 \
                           --disable CONFIG_KERNEL_LZMA \
                           --disable CONFIG_KERNEL_XZ \
                           --disable CONFIG_KERNEL_LZO \
                           --disable CONFIG_KERNEL_LZ4 \
                           --disable CONFIG_KERNEL_ZSTD
          
          # --- C. 补全 Surface 驱动 ---
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_INTEL_ISH_HID \
                           --enable CONFIG_I2C_HID_ACPI \
                           --enable CONFIG_KSU

          make olddefconfig

      - name: 6. 编译并强制剥离符号 (Strip)
        working-directory: kernel-source
        run: |
          # 现在 make bzImage 会生成一个未压缩的巨大文件，但 Surface UEFI 应该能加载
          make bzImage -j$(nproc) KCFLAGS="-w"
          make modules -j$(nproc) KCFLAGS="-w" INSTALL_MOD_STRIP=1

      - name: 7. 获取 iptsd 并打包
        run: |
          mkdir -p output/bin
          wget https://github.com/linux-surface/iptsd/releases/latest/download/iptsd -O output/bin/iptsd
          chmod +x output/bin/iptsd

          if [ -f "kernel-source/arch/x86/boot/bzImage" ]; then
            # 产物 kernel 现在会很大
            cp kernel-source/arch/x86/boot/bzImage output/kernel
            cd kernel-source
            make INSTALL_MOD_PATH=../output/modules_install INSTALL_MOD_STRIP=1 modules_install
            cd ../output
            tar -czvf surface_uncompressed_slim.tar.gz modules_install bin/iptsd
          else
            exit 1
          fi

      - name: 8. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Universal-Uncompressed-Kernel-2026
          path: output/
