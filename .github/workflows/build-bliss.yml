      - name: 5. 配置增强版 Surface 驱动与内核参数
        working-directory: kernel-source
        run: |
          make mrproper
          make x86_64_defconfig
          
          # --- 1. 核心修复：启用 ZSTD 压缩 (确保 EFI 兼容性) ---
          ./scripts/config --enable CONFIG_KERNEL_ZSTD
          
          # --- 2. 增强 Surface 核心驱动 (全部强制内置 =y) ---
          # 基础总线支持
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_SURFACE_AGGREGATOR_BUS \
                           --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY \
                           --enable CONFIG_SURFACE_AGGREGATOR_HUB \
                           --enable CONFIG_SURFACE_HOTPLUG
          
          # 输入设备与触控 (IPTS/ITHC 依赖)
          ./scripts/config --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_INTEL_ISH_HID \
                           --enable CONFIG_I2C_HID_ACPI \
                           --enable CONFIG_SURFACE_HID_CORE
          
          # 电源与平台管理 (修复电量显示与睡眠)
          ./scripts/config --enable CONFIG_SURFACE_GPE \
                           --enable CONFIG_SURFACE_PLATFORM_FLAGS \
                           --enable CONFIG_SURFACE_ACPI_NOTIFY \
                           --enable CONFIG_SURFACE_DTX \
                           --enable CONFIG_BATTERY_SURFACE
          
          # --- 3. 性能与体积优化 ---
          ./scripts/config --disable CONFIG_DEBUG_INFO \
                           --enable CONFIG_DEBUG_INFO_NONE \
                           --disable CONFIG_DEBUG_FS \
                           --disable CONFIG_WERROR \
                           --disable CONFIG_GCC_PLUGINS
          
          # --- 4. 功能性增强 (UEFI Stub & KernelSU) ---
          ./scripts/config --enable CONFIG_EFI_STUB \
                           --enable CONFIG_EFI_MIXED \
                           --enable CONFIG_KSU \
                           --enable CONFIG_BLK_DEV_NVME

          make olddefconfig
