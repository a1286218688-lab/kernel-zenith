name: Build Zenith Kernel for Surface

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: 2. 检出 KernelSU
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          path: ksu-src
          fetch-depth: 1

      - name: 3. 安装 2026 编译环境
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev \
          libncurses-dev rsync pahole llvm lld clang libzstd-dev lz4 wget tar llvm-dev

      - name: 4. 物理集成 KernelSU
        run: |
          cd kernel-source
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          cp -r ../ksu-src/kernel/* drivers/kernelsu/
          sed -i '/kernelsu/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: 5. 配置 Surface 全驱动 (含最新 IPTS/ISH 触摸支持)
        working-directory: kernel-source
        run: |
          make mrproper
          make x86_64_defconfig
          ./scripts/config --disable CONFIG_WERROR
          
          # 开启 Surface 核心驱动
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_SURFACE_AGGREGATOR_BUS \
                           --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY \
                           --enable CONFIG_SURFACE_HOTPLUG \
                           --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_SURFACE_GPE \
                           --enable CONFIG_SURFACE_SAM
          
          # 开启触摸屏内核通道 (IPTS & ISH)
          ./scripts/config --enable CONFIG_VIDEO_IPTS \
                           --enable CONFIG_INTEL_IPTS \
                           --enable CONFIG_HID_IPTS \
                           --enable CONFIG_USB_HID \
                           --enable CONFIG_HID_MULTITOUCH \
                           --enable CONFIG_INTEL_ISH_HID \
                           --enable CONFIG_INTEL_VSEC
          
          ./scripts/config --enable CONFIG_KSU
          
          # 2026 链接优化
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF \
                           --disable CONFIG_GCC_PLUGINS \
                           --disable CONFIG_LTO_CLANG_FULL \
                           --disable CONFIG_LTO_CLANG_THIN \
                           --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          
          make olddefconfig

      - name: 6. 执行多线程编译
        working-directory: kernel-source
        run: |
          make bzImage -j$(nproc) KCFLAGS="-w" || make bzImage -j1 KCFLAGS="-w"
          make modules -j$(nproc) KCFLAGS="-w"

      - name: 7. 获取最新 iptsd 并打包产物
        run: |
          mkdir -p output/bin
          # 自动获取 Linux-Surface 官方 2026 最新版 iptsd
          # 我们尝试下载静态链接的二进制文件
          wget github.com -O output/bin/iptsd || \
          echo "Warning: iptsd download failed, you may need to compile it manually."
          chmod +x output/bin/iptsd

          if [ -f "kernel-source/arch/x86/boot/bzImage" ]; then
            cp kernel-source/arch/x86/boot/bzImage output/kernel
            cd kernel-source
            make INSTALL_MOD_PATH=../output/modules_install modules_install
            cd ../output
            # 将 iptsd 一并存入压缩包
            tar -czvf surface_full_package.tar.gz modules_install bin/iptsd
          else
            echo "错误：内核生成失败！"
            exit 1
          fi

      - name: 8. 上传
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Kernel-KSU-IPTSD-2026
          path: output/
