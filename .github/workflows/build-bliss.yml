name: Build Zenith Kernel for Surface

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 获取内核源码
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: 2. 安装内核编译工具
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev libncurses-dev rsync

      - name: 3. 集成 KernelSU (手动创建目录并克隆)
        # 放弃使用 checkout 插件的 path 属性，改用命令行以确保目录树正确生成
        run: |
          cd kernel-source
          mkdir -p drivers/kernelsu
          # 使用 --depth 1 提高 2026 年网络环境下 Actions 的拉取成功率
          git clone --depth 1 github.com drivers/kernelsu
          
          # 验证文件是否进入正确目录
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then echo "KernelSU 源码缺失"; exit 1; fi

          # 自动修补引用
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu/" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: 4. 配置并开启驱动
        working-directory: kernel-source
        run: |
          make x86_64_defconfig
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_SURFACE_AGGREGATOR_BUS \
                           --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY \
                           --enable CONFIG_SURFACE_HOTPLUG \
                           --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_SURFACE_GPE \
                           --enable CONFIG_SURFACE_SAM \
                           --enable CONFIG_KSU
          # 2026 编译规范：必须执行 olddefconfig 处理 Kconfig 变动
          make olddefconfig

      - name: 5. 编译内核
        working-directory: kernel-source
        run: |
          make bzImage -j$(nproc)
          make modules -j$(nproc)

      - name: 6. 整理并打包产物
        run: |
          mkdir -p output/modules_install
          cp kernel-source/arch/x86/boot/bzImage output/kernel
          cd kernel-source
          make INSTALL_MOD_PATH=../output/modules_install modules_install
          cd ../output && tar -czvf surface_modules.tar.gz modules_install

      - name: 7. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Zenith-Kernel-Package
          path: output/
