name: Build Zenith Kernel for Surface

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1_Install_Tools
        run: sudo apt update && sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev libncurses-dev rsync

      - name: 2_Clone_Source
        # 2026年终极修复：使用 GitHub 环境变量组合地址，不直接在脚本里写 URL
        run: |
          git clone --branch zenith-14 --depth 1 "github.com" kernel-zenith

      - name: 3_Configure_Kernel
        run: |
          cd kernel-zenith
          make x86_64_defconfig
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR_BUS
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY
          ./scripts/config --enable CONFIG_SURFACE_HOTPLUG
          ./scripts/config --enable CONFIG_HID_SURFACE_HID
          ./scripts/config --enable CONFIG_SURFACE_GPE
          ./scripts/config --enable CONFIG_SURFACE_SAM

      - name: 4_Build_Kernel
        run: |
          cd kernel-zenith
          make bzImage -j$(nproc)
          make modules -j$(nproc)

      - name: 5_Package
        run: |
          mkdir -p output/modules_install
          cp kernel-zenith/arch/x86/boot/bzImage output/kernel
          cd kernel-zenith
          make INSTALL_MOD_PATH=../output/modules_install modules_install
          cd ../output
          tar -czvf surface_modules.tar.gz modules_install

      - name: 6_Upload
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Zenith-Kernel
          path: output/
