
name: Build Zenith Kernel for Surface

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出内核源码
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: 2. 检出 KernelSU 源码 (独立路径)
        uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          path: ksu-src
          fetch-depth: 1

      - name: 3. 安装编译工具
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev libncurses-dev rsync

      - name: 4. 物理集成与修补 (核心修复步)
        run: |
          # 1. 强力清理内核源码中可能存在的残留
          rm -rf kernel-source/drivers/kernelsu
          
          # 2. 将独立检出的 KSU 源码物理移动到内核驱动目录
          mv ksu-src/kernel kernel-source/drivers/kernelsu
          
          # 3. 修正 Kconfig/Makefile 引用
          cd kernel-source
          sed -i '/kernelsu/d' drivers/Kconfig
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          
          sed -i '/kernelsu/d' drivers/Makefile
          echo 'obj-y += kernelsu/' >> drivers/Makefile
          
          # 4. 验证文件
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then echo "错误：源码链接失败"; exit 1; fi

      - name: 5. 配置并开启驱动
        working-directory: kernel-source
        run: |
          make x86_64_defconfig
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_SURFACE_AGGREGATOR_BUS \
                           --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY \
                           --enable CONFIG_SURFACE_HOTPLUG \
                           --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_SURFACE_GPE \
                           --enable CONFIG_SURFACE_SAM \
                           --enable CONFIG_KSU
          make olddefconfig

      - name: 6. 编译内核
        working-directory: kernel-source
        run: |
          make bzImage -j$(nproc)
          make modules -j$(nproc)

      - name: 7. 打包产物
        run: |
          mkdir -p output/modules_install
          cp kernel-source/arch/x86/boot/bzImage output/kernel
          cd kernel-source
          make INSTALL_MOD_PATH=../output/modules_install modules_install
          cd ../output && tar -czvf surface_modules.tar.gz modules_install

      - name: 8. 上传
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Kernel-KSU-Final
          path: output/
