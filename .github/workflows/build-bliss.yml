name: Build Zenith Kernel for Surface

on:
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击 "Run workflow"

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取内核源码
        uses: actions/checkout@v4
        with:
          path: kernel-source

      - name: 2. 安装 2026 编译必备环境
        run: |
          sudo apt update
          sudo apt install -y git-core build-essential bc bison flex libssl-dev libelf-dev libncurses-dev rsync

      - name: 3. 集成 KernelSU (暴力清理并重克隆)
        run: |
          cd kernel-source
          # 强制清理旧残留，解决 File exists 报错
          rm -rf drivers/kernelsu
          
          # 手动拉取源码
          git clone --depth 1 github.com drivers/kernelsu
          
          # 检查克隆是否成功
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "KernelSU 源码获取失败，请检查网络。"
            exit 1
          fi

          # 自动插入引用 (带去重逻辑)
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          grep -q "kernelsu/" drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile

      - name: 4. 自动化内核配置
        working-directory: kernel-source
        run: |
          # 生成基础配置
          make x86_64_defconfig
          
          # 开启 Surface 驱动及 KernelSU
          ./scripts/config --enable CONFIG_SURFACE_AGGREGATOR \
                           --enable CONFIG_SURFACE_AGGREGATOR_BUS \
                           --enable CONFIG_SURFACE_AGGREGATOR_REGISTRY \
                           --enable CONFIG_SURFACE_HOTPLUG \
                           --enable CONFIG_HID_SURFACE_HID \
                           --enable CONFIG_SURFACE_GPE \
                           --enable CONFIG_SURFACE_SAM \
                           --enable CONFIG_KSU
          
          # 2026 标准：同步并检查配置依赖
          make olddefconfig

      - name: 5. 执行多线程编译
        working-directory: kernel-source
        run: |
          # 使用所有可用 CPU 核心进行加速
          make bzImage -j$(nproc)
          make modules -j$(nproc)

      - name: 6. 提取并打包编译产物
        run: |
          mkdir -p output/modules_install
          # 拷贝内核镜像
          cp kernel-source/arch/x86/boot/bzImage output/kernel
          # 拷贝驱动模块
          cd kernel-source
          make INSTALL_MOD_PATH=../output/modules_install modules_install
          # 打包模块
          cd ../output
          tar -czvf surface_modules.tar.gz modules_install

      - name: 7. 发布产物
        uses: actions/upload-artifact@v4
        with:
          name: Surface-Zenith-Kernel-With-KSU
          path: output/
